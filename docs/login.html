<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Blendy</title>
<meta name="description" content="Masuk ke akun Blendy dalam mode demo. Tidak ada password yang disimpan dan belum ada koneksi ke server.">
<meta property="og:title" content="Login — Blendy">
<meta property="og:description" content="Masuk ke akun demo Blendy.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='28' r='17' fill='%23F2AFC0'/%3E%3Cpath d='M24 13 q1-7 8-9 q1 7-5 10 q8-1 11 4 q-7 4-13-1 q-1-2-1-4z' fill='%236F9E3E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-nav="">
<a class="skip-link" href="#main">Lewati ke konten</a>
<header class="site-header" id="siteHeader"></header>

<main id="main">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Selamat Datang Kembali</h1>
      <p class="auth-sub">Mode demo: gunakan email apa pun dan password minimal 6 karakter. Password tidak pernah disimpan.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="liEmail">Email</label>
          <input id="liEmail" name="email" type="email" placeholder="nama@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="liPass">Password</label>
          <input id="liPass" name="password" type="password" placeholder="Minimal 6 karakter" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Login</button>
      </form>

      <p class="auth-alt">
        <button type="button" class="link-btn" id="forgotToggle" aria-expanded="false" aria-controls="forgotPanel">Lupa Password?</button>
      </p>
      <div class="forgot-panel" id="forgotPanel">
        <form id="forgotForm" novalidate style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
          <div class="field">
            <label for="fgEmail">Email untuk Reset</label>
            <input id="fgEmail" name="email" type="email" placeholder="nama@email.com" autocomplete="email">
          </div>
          <button class="btn btn-ghost" type="submit">Kirim Tautan Reset (Simulasi)</button>
          <p class="form-msg" id="forgotMsg" role="status"></p>
        </form>
      </div>

      <p class="auth-alt">Belum punya akun? <a href="register.html">Register di sini</a></p>
    </div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-hidden="true" aria-label="Keranjang belanja">
  <div class="drawer-head"><h3>Keranjangmu</h3><button type="button" class="drawer-close" data-cart-close aria-label="Tutup keranjang">✕</button></div>
  <div class="drawer-body" id="cartDrawerBody"></div>
  <div class="drawer-foot" id="cartDrawerFoot"></div>
</aside>

<div class="modal" id="quickView" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="qvTitle">
  <div class="modal-card">
    <button type="button" class="modal-close" data-qv-close aria-label="Tutup detail produk">✕</button>
    <div class="qv-layout" id="qvBody"></div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>
<script src="js/app.js"></script>
</body>
</html>

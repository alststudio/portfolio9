<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang — Blendy</title>
<meta name="description" content="Keranjang belanja Blendy: atur jumlah, pakai voucher BLENDY10, dan lanjut ke checkout simulasi.">
<meta property="og:title" content="Keranjang — Blendy">
<meta property="og:description" content="Periksa isi keranjang smoothie kamu sebelum checkout.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='28' r='17' fill='%23F2AFC0'/%3E%3Cpath d='M24 13 q1-7 8-9 q1 7-5 10 q8-1 11 4 q-7 4-13-1 q-1-2-1-4z' fill='%236F9E3E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-nav="shop">
<a class="skip-link" href="#main">Lewati ke konten</a>
<header class="site-header" id="siteHeader"></header>

<main id="main">
  <section class="page-hero wrap">
    <span class="eyebrow">Cart</span>
    <h1>Keranjang Belanja</h1>
    <p>Atur jumlah, hapus item, atau pakai voucher. Keranjang tersimpan otomatis di browser kamu, jadi tetap aman setelah halaman dimuat ulang.</p>
  </section>

  <section class="section" style="padding-top:30px">
    <div class="wrap split-layout">
      <div class="cart-page-list" id="cartPageItems"></div>
      <aside class="side-card" id="cartPageSummary" aria-label="Ringkasan belanja"></aside>
    </div>
  </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-hidden="true" aria-label="Keranjang belanja">
  <div class="drawer-head"><h3>Keranjangmu</h3><button type="button" class="drawer-close" data-cart-close aria-label="Tutup keranjang">✕</button></div>
  <div class="drawer-body" id="cartDrawerBody"></div>
  <div class="drawer-foot" id="cartDrawerFoot"></div>
</aside>

<div class="modal" id="quickView" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="qvTitle">
  <div class="modal-card">
    <button type="button" class="modal-close" data-qv-close aria-label="Tutup detail produk">✕</button>
    <div class="qv-layout" id="qvBody"></div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>
<script src="js/app.js"></script>
</body>
</html>

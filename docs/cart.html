<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keranjang — Blendy</title>
<meta name="description" content="Keranjang belanja Blendy: atur jumlah, pakai voucher BLENDY10, dan lanjutkan ke checkout.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23C2B0DC'/%3E%3Ctext x='32' y='44' font-family='Arial Black' font-size='34' font-weight='900' fill='%23302B35' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">
<header class="site-bar" data-site-header></header>

<main>
  <div class="page-head wrap">
    <h1>Keranjang Belanja</h1>
    <p>Periksa kembali pesananmu sebelum checkout.</p>
  </div>

  <section class="page-section wrap">
    <div id="cartPageEmpty" class="cart-panel" hidden>
      <div class="cart-empty">
        <p>Keranjangmu masih kosong.</p>
        <p class="muted">Yuk, jelajahi katalog dan temukan smoothie favoritmu.</p>
        <a class="btn btn-primary" href="shop.html" style="margin-top:18px">Mulai Belanja</a>
      </div>
    </div>

    <div class="cart-layout" id="cartPageContent" hidden>
      <div class="cart-panel">
        <div id="cartPageBody"></div>
        <button type="button" class="cart-remove" id="clearCartBtn" style="margin-top:14px">Kosongkan Keranjang</button>
      </div>
      <div class="cart-panel">
        <h3 style="font-family:'Baloo 2',sans-serif;font-size:21px;margin-bottom:8px">Ringkasan</h3>
        <div class="voucher-row">
          <input type="text" id="voucherInput" placeholder="Kode voucher (coba BLENDY10)" aria-label="Kode voucher">
          <button type="button" class="btn btn-soft" id="applyVoucherBtn">Pakai</button>
        </div>
        <p class="form-msg" id="voucherMsg" role="status"></p>
        <div id="cartPageTotals"></div>
        <a class="btn btn-primary btn-block" href="checkout.html">Lanjut ke Checkout</a>
        <a class="btn btn-ghost btn-block" href="shop.html">Kembali Belanja</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" data-site-footer></footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>

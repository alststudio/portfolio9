<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Blendy</title>
<meta name="description" content="Akun demo Blendy: profil dan riwayat pesananmu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23B4D58A'/%3E%3Ctext x='32' y='44' font-family='Arial Black' font-size='34' font-weight='900' fill='%23302B35' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="account">
<header class="site-bar" data-site-header></header>

<main>
  <div class="page-head wrap">
    <h1>My Account</h1>
    <p>Profil dan riwayat pesanan demo kamu.</p>
  </div>

  <section class="page-section wrap">
    <div class="account-grid" id="accountWrap">
      <div class="cart-panel">
        <h3 style="font-family:'Baloo 2',sans-serif;font-size:21px;margin-bottom:14px">Profil</h3>
        <p style="font-size:19px;font-weight:700" id="accName">\u2014</p>
        <p class="muted" id="accEmail">\u2014</p>
        <p class="badge badge-contoh" style="margin-top:12px">Akun mode demo</p>
        <button type="button" class="btn btn-ghost btn-block" id="logoutBtn" style="margin-top:20px">Keluar</button>
      </div>
      <div>
        <h3 style="font-family:'Baloo 2',sans-serif;font-size:23px;margin-bottom:18px">Order History</h3>
        <div id="orderHistory"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" data-site-footer></footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
